<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monitoring Bensin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050608;
      --panel: #1f2023;
      --panel-2: #282a2f;
      --ink: #f8fafc;
      --muted: #a7abb4;
      --line: rgba(255,255,255,.09);
      --green: #35d36f;
      --green-dark: #15592d;
      --blue: #2f83ff;
      --orange: #f59e0b;
      --red: #ef4444;
      --shadow: 0 18px 50px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    h2, p { margin: 0; }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 14px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    .vehicle-tabs, .mode-tabs {
      display: grid;
      gap: 6px;
      background: #111214;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px;
    }

    .vehicle-tabs {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 12px;
    }

    .mode-tabs {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .vehicle-tab, .mode-tab {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
      cursor: pointer;
    }

    .vehicle-tab.active, .mode-tab.active {
      background: var(--panel-2);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .fuel-card {
      border-radius: 8px;
      min-height: 112px;
      overflow: hidden;
      background: var(--green-dark);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      position: relative;
      isolation: isolate;
    }

    .fuel-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--pct, 0%);
      min-width: 0;
      background: var(--fuel-color, var(--green));
      transition: width .28s ease, background .28s ease;
      z-index: -1;
    }

    .fuel-card.low { background: #4a1f08; }
    .fuel-card.empty { background: #3d1010; }

    .fuel-content {
      min-height: 112px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 16px;
      background: linear-gradient(90deg, rgba(0,0,0,.02), rgba(0,0,0,.18));
    }

    .percent-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 112px;
    }

    .percent {
      font-size: clamp(44px, 15vw, 72px);
      line-height: .88;
      font-weight: 850;
      letter-spacing: 0;
    }

    .percent-unit {
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 750;
      color: rgba(255,255,255,.82);
    }

    .fuel-copy {
      font-size: clamp(14px, 4vw, 20px);
      color: rgba(255,255,255,.9);
      font-weight: 650;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .fuel-copy strong { color: #fff; }

    .stats-list {
      display: grid;
      gap: 1px;
      background: var(--line);
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
    }

    .stat-row {
      min-height: 58px;
      padding: 13px 16px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .stat-row strong {
      font-size: 16px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-pad { padding: 18px; }

    .section-title, .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title { margin-bottom: 14px; }
    .history-head { padding: 16px 18px; }

    .section-title h2, .history-head h2 {
      font-size: 19px;
      font-weight: 850;
    }

    .entry-form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.hidden { display: none; }
    .input-wrap { position: relative; }

    input[type="number"] {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111214;
      color: var(--ink);
      padding: 0 66px 0 14px;
      font-size: 23px;
      font-weight: 850;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: rgba(53,211,111,.75);
      box-shadow: 0 0 0 3px rgba(53,211,111,.14);
    }

    .unit {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .primary {
      min-height: 50px;
      /* min-height: 56px; */
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #041008;
      font-weight: 950;
      cursor: pointer;
    }

    .primary:disabled, .icon-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .icon-btn, .delete {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #111214;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .config {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .config-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .config-row strong {
      color: var(--ink);
      text-align: right;
    }

    .chart-wrap { padding: 18px; }

    .chart-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 10px;
    }

    .chart-metric {
      font-size: clamp(34px, 11vw, 54px);
      font-weight: 850;
      line-height: 1;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-weight: 700;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--blue);
    }

    .dot.green { background: var(--green); }

    .chart-stage {
      position: relative;
      height: 250px;
      overflow: hidden;
    }

    .chart-stage svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .grid-line {
      stroke: rgba(255,255,255,.08);
      stroke-dasharray: 2 3;
    }

    .history { border-top: 1px solid var(--line); }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 900;
      background: rgba(47,131,255,.16);
      color: #9dc4ff;
      white-space: nowrap;
    }

    .pill.full {
      background: rgba(53,211,111,.15);
      color: #9df0bb;
    }

    .pill.partial {
      background: rgba(245,158,11,.16);
      color: #facc15;
    }

    .table-wrap {
      overflow: auto;
      max-height: 430px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    th, td {
      padding: 13px 16px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .delete {
      width: 38px;
      height: 38px;
      color: #fecaca;
      background: rgba(239,68,68,.14);
      margin-left: auto;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 36px 16px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(80px);
      width: min(440px, calc(100% - 32px));
      background: #f7f7f8;
      color: #111214;
      border-radius: 8px;
      padding: 13px 15px;
      font-weight: 800;
      opacity: 0;
      transition: .22s ease;
      z-index: 20;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    svg.icon {
      width: 21px;
      height: 21px;
      stroke-width: 2.35;
      flex: 0 0 auto;
    }

    @media (max-width: 860px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .chart-stage { height: 235px; }
    }

    @media (max-width: 520px) {
      .app { padding: 12px; }
      .fuel-content {
        grid-template-columns: 1fr;
        gap: 8px;
        align-content: center;
      }
      .percent-row { min-width: 0; }
      .mode-tabs { grid-template-columns: 1fr; }
      .chart-head { grid-template-columns: 1fr; }
      .legend { justify-content: flex-start; }
      .panel-pad, .chart-wrap { padding: 16px; }
      th, td { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="vehicle-tabs" id="vehicleTabs" aria-label="Pilih kendaraan">
      <button class="vehicle-tab active" type="button" data-vehicle="beat">Beat</button>
      <button class="vehicle-tab" type="button" data-vehicle="cb150r">CB150R</button>
    </nav>

    <section class="fuel-card" id="fuelCard">
      <div class="fuel-fill" id="fuelFill"></div>
      <div class="fuel-content">
        <div class="percent-row">
          <span class="percent" id="percentText">0</span>
          <span class="percent-unit">%</span>
        </div>
        <p class="fuel-copy" id="fuelCopy">Mengambil data...</p>
      </div>
    </section>

    <section class="stats-list">
      <div class="stat-row">
        <span class="label">Odometer</span>
        <strong id="currentOdoText">...</strong>
      </div>
      <div class="stat-row">
        <span class="label">Last Trip</span>
        <strong id="lastTripText">...</strong>
      </div>
      <div class="stat-row">
        <span class="label">Cost Trip</span>
        <strong id="costTripText">...</strong>
      </div>
      <div class="stat-row">
        <span class="label">Cost Re-fuel</span>
        <strong id="refuelCostText">...</strong>
      </div>
    </section>

    <div class="dashboard-grid">
      <aside class="panel">
        <div class="panel-pad">
          <div class="section-title">
            <h2>Re-Fuel Methode</h2>
          </div>
          <form class="entry-form" id="entryForm">
            <div class="mode-tabs" id="modeTabs" aria-label="Jenis log">
              <button class="mode-tab active" type="button" data-mode="odometer">Odometer</button>
              <button class="mode-tab" type="button" data-mode="partial">Harga</button>
            </div>

            <label class="field" id="odoField">
              <span class="label">Odometer saat ini</span>
              <span class="input-wrap">
                <input id="odoInput" type="number" step="0.1" min="0" inputmode="decimal" placeholder="00000.0" autocomplete="off">
                <span class="unit">KM</span>
              </span>
            </label>

            <label class="field hidden" id="purchaseField">
              <span class="label">Harga beli</span>
              <span class="input-wrap">
                <input id="purchaseInput" type="number" step="100" min="0" inputmode="numeric" placeholder="50000" autocomplete="off">
                <span class="unit">RP</span>
              </span>
            </label>

            <button class="primary" id="saveBtn" type="submit">Simpan Log</button>
          </form>
          <div class="config" id="configBox"></div>
        </div>
      </aside>

      <section class="panel">
        <div class="chart-wrap">
          <div class="chart-head">
            <div>
              <p class="label">Fuel usage</p>
              <p class="chart-metric" id="chartMetric">0%</p>
            </div>
            <div class="legend">
              <span><i class="dot"></i>Persen bensin</span>
              <span><i class="dot green"></i>Sisa km</span>
            </div>
          </div>
          <div class="chart-stage" id="fuelChart" aria-label="Grafik persentase bensin"></div>
        </div>
        <div class="history">
          <div class="history-head">
            <h2>Riwayat</h2>
            <button class="icon-btn" id="refreshBtn" type="button" title="Refresh" aria-label="Refresh data">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
            </button>
            <span class="pill" id="recordCount">0 record</span>
          </div>
          <div class="table-wrap" id="tableWrap"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const app = {
      vehicleKey: 'beat',
      logType: 'odometer',
      config: null,
      rows: [],
      chartRows: [],
      historyCount: 0,
      stats: null,
      loading: false
    };

    const $ = (id) => document.getElementById(id);

    function fmtKm(n) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return 'N/A';
      return Number(n).toFixed(1).replace('.', ',') + ' km';
    }

    function fmtRp(n) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return 'N/A';
      return 'Rp ' + Math.abs(Math.round(Number(n))).toLocaleString('id-ID');
    }

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => el.classList.remove('show'), 2600);
    }

    function callServer(fn, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(err))
          [fn](...args);
      });
    }

    async function loadData() {
      setLoading(true);
      try {
        applyData(await callServer('getAppData', app.vehicleKey));
      } catch (err) {
        toast(err.message || 'Gagal mengambil data.');
      } finally {
        setLoading(false);
      }
    }

    function applyData(data) {
      app.config = data.config || {};
      app.rows = data.rows || [];
      app.chartRows = data.chartRows || app.rows;
      app.historyCount = data.historyCount || app.rows.length;
      app.stats = data.stats || {};
      render();
    }

    function setLoading(value) {
      app.loading = value;
      $('saveBtn').disabled = value;
      $('refreshBtn').disabled = value;
    }

    function render() {
      const s = app.stats || {};
      const c = app.config || {};
      const pct = Math.max(0, Math.min(100, Math.round(s.percentFuel || 0)));
      const isLow = pct > 0 && pct < 25;
      const isEmpty = Boolean(s.isEmpty);
      const vehicleLabel = c.vehicleLabel || (app.vehicleKey === 'cb150r' ? 'CB150R' : 'Beat');

      $('percentText').textContent = String(pct);
      $('chartMetric').textContent = pct + '%';
      $('currentOdoText').textContent = fmtKm(s.currentOdo);
      $('lastTripText').textContent = fmtKm(s.lastTrip);
      $('costTripText').textContent = fmtRp(s.costTrip);
      $('refuelCostText').textContent = fmtRp(s.refuelEstimate);

      const remaining = isEmpty ? 'BENSIN HABIS' : fmtKm(s.remainingKm);
      $('fuelCopy').innerHTML = '<strong>' + remaining + '</strong> left';

      const fuelCard = $('fuelCard');
      fuelCard.classList.toggle('low', isLow);
      fuelCard.classList.toggle('empty', isEmpty);
      fuelCard.style.setProperty('--pct', pct + '%');
      fuelCard.style.setProperty('--fuel-color', isEmpty ? 'var(--red)' : isLow ? 'var(--orange)' : 'var(--green)');

      $('recordCount').textContent = app.historyCount > app.rows.length
        ? app.rows.length + ' dari ' + app.historyCount + ' log'
        : app.rows.length + ' log';
      $('configBox').innerHTML = `
        // <div class="config-row"><span>Kendaraan</span><strong>${vehicleLabel}</strong></div>
        // <div class="config-row"><span>Tab sheet</span><strong>${c.sheetName || '-'}</strong></div>
        // <div class="config-row"><span>Range full tank</span><strong>${fmtKm(c.range)}</strong></div>
        // <div class="config-row"><span>Biaya full tank</span><strong>${fmtRp(c.fuelFullCost)}</strong></div>
        // <div class="config-row"><span>Harga BBM/liter</span><strong>${fmtRp(c.fuelPricePerLiter)}</strong></div>
      `;

      syncTabs();
      syncMode();
      renderChart();
      renderTable();
    }

    function renderChart() {
      const chart = $('fuelChart');
      const points = (app.chartRows || app.rows).slice(-14);
      if (!points.length) {
        chart.innerHTML = '<div class="empty">Belum ada grafik.</div>';
        return;
      }

      const width = 620;
      const height = 250;
      const left = 28;
      const right = 58;
      const top = 16;
      const bottom = 28;
      const plotW = width - left - right;
      const plotH = height - top - bottom;

      const coords = points.map((row, i) => {
        const x = left + (points.length === 1 ? plotW : (i / (points.length - 1)) * plotW);
        const y = top + (1 - Math.max(0, Math.min(100, row.percentFuel || 0)) / 100) * plotH;
        return { x, y, row };
      });

      const line = coords.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
      const area = `${left},${height - bottom} ${line} ${left + plotW},${height - bottom}`;
      const grid = [100, 75, 50, 25].map(value => {
        const y = top + (1 - value / 100) * plotH;
        return `<line class="grid-line" x1="${left}" x2="${left + plotW}" y1="${y}" y2="${y}"></line>
          <text class="axis-label" x="${left + plotW + 22}" y="${y + 4}">${value}%</text>`;
      }).join('');

      const markers = coords.map((p, i) => {
        const label = Math.round(p.row.percentFuel || 0) + '% - ' + fmtKm(p.row.remainingKm);
        const isLast = i === coords.length - 1;
        return `<circle cx="${p.x}" cy="${p.y}" r="${isLast ? 6 : 3.5}" fill="${isLast ? 'var(--panel)' : 'var(--blue)'}" stroke="var(--blue)" stroke-width="${isLast ? 4 : 0}">
          <title>${label}</title>
        </circle>`;
      }).join('');

      chart.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Grafik persentase bensin">
          <defs>
            <linearGradient id="fuelArea" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="var(--blue)" stop-opacity=".45"></stop>
              <stop offset="100%" stop-color="var(--blue)" stop-opacity=".05"></stop>
            </linearGradient>
          </defs>
          ${grid}
          <polygon points="${area}" fill="url(#fuelArea)"></polygon>
          <polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline>
          ${markers}
          <line x1="${left + plotW * .32}" x2="${left + plotW * .82}" y1="${height - 15}" y2="${height - 15}" stroke="rgba(255,255,255,.7)" stroke-width="6" stroke-linecap="round"></line>
        </svg>
      `;
    }

    function renderTable() {
      const wrap = $('tableWrap');
      if (!app.rows.length) {
        wrap.innerHTML = '<div class="empty">Belum ada log odometer.</div>';
        return;
      }

      const rows = [...app.rows].reverse();
      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Jenis</th>
              <th>Odometer</th>
              <th>Harga</th>
              <th>Tambah</th>
              <th>Fuel</th>
              <th>Sisa</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${row.timestamp || '-'}</td>
                <td><span class="pill ${row.logType || 'odometer'}">${row.logLabel || 'Odometer'}</span></td>
                <td><strong>${fmtKm(row.odometer)}</strong></td>
                <td>${fmtRp(row.purchaseAmount)}</td>
                <td>${fmtKm(row.addedKm)}</td>
                <td>${Math.round(row.percentFuel || 0)}%</td>
                <td>${row.isEmpty ? 'Habis' : fmtKm(row.remainingKm)}</td>
                <td><button class="delete" type="button" data-delete="${row.rowNumber}" title="Hapus" aria-label="Hapus log">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                </button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function syncTabs() {
      document.querySelectorAll('[data-vehicle]').forEach(button => {
        button.classList.toggle('active', button.dataset.vehicle === app.vehicleKey);
      });
    }

    function syncMode() {
      document.querySelectorAll('[data-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === app.logType);
      });
      const isPartial = app.logType === 'partial';
      $('odoField').classList.toggle('hidden', isPartial);
      $('purchaseField').classList.toggle('hidden', !isPartial);
      $('saveBtn').textContent = isPartial ? 'Simpan Harga' : 'Simpan Odometer';
    }

    $('vehicleTabs').addEventListener('click', (event) => {
      const button = event.target.closest('[data-vehicle]');
      if (!button || button.dataset.vehicle === app.vehicleKey) return;
      app.vehicleKey = button.dataset.vehicle;
      app.logType = 'odometer';
      $('odoInput').value = '';
      $('purchaseInput').value = '';
      syncTabs();
      syncMode();
      loadData();
    });

    $('modeTabs').addEventListener('click', (event) => {
      const button = event.target.closest('[data-mode]');
      if (!button) return;
      app.logType = button.dataset.mode;
      syncMode();
    });

    $('entryForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const odometer = Number($('odoInput').value);
      const purchaseAmount = Number($('purchaseInput').value);

      if (app.logType !== 'partial' && !odometer) {
        toast('Masukkan odometer dulu.');
        return;
      }

      if (app.logType === 'partial' && !purchaseAmount) {
        toast('Masukkan harga beli dulu.');
        return;
      }

      setLoading(true);
      try {
        const payload = {
          vehicleKey: app.vehicleKey,
          logType: app.logType
        };
        if (app.logType === 'partial') payload.purchaseAmount = purchaseAmount;
        else payload.odometer = odometer;

        const data = await callServer('addEntry', payload);
        $('odoInput').value = '';
        $('purchaseInput').value = '';
        app.logType = 'odometer';
        applyData(data);
        toast('Log tersimpan.');
      } catch (err) {
        toast(err.message || 'Gagal menyimpan log.');
      } finally {
        setLoading(false);
      }
    });

    $('tableWrap').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-delete]');
      if (!button) return;
      if (!confirm('Hapus log ini?')) return;

      setLoading(true);
      try {
        applyData(await callServer('deleteEntry', app.vehicleKey, Number(button.dataset.delete)));
        toast('Log dihapus.');
      } catch (err) {
        toast(err.message || 'Gagal menghapus log.');
      } finally {
        setLoading(false);
      }
    });

    $('refreshBtn').addEventListener('click', loadData);

    syncTabs();
    syncMode();
    loadData();
  </script>
</body>
</html>
