plugins {
    id "com.android.application"
}

android {
    namespace "com.bensinmonitoring.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.bensinmonitoring.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        def webAppUrl = project.findProperty("WEBAPP_URL") ?: "https://script.google.com/macros/s/REPLACE_WITH_DEPLOYMENT_ID/exec"
        buildConfigField "String", "WEBAPP_URL", "\"${webAppUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
